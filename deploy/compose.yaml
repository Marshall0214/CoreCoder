name: corecoder-local
services:
  repair:
    image: ${CORECODER_IMAGE:-corecoder-local:dev}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    init: true
    environment:
      CORECODER_MODEL_BASE_URL: ${CORECODER_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${CORECODER_PORT:-8002}:8000"
    volumes:
      - task-data:/app/.tmp/service
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, python, /app/deploy/healthcheck.py]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
volumes:
  task-data:
